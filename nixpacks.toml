[variables]
ELECTRON_SKIP_BINARY_DOWNLOAD = "1"
CI = "true"

[phases.setup]
nixPkgs = ["nodejs", "npm", "ffmpeg", "python311"]

[phases.install]
cmds = ["npm ci --include=dev", "python3 -m ensurepip", "python3 -m pip install spleeter"]

[phases.build]
cmds = ["npx prisma generate", "npm run build"]

[start]
cmd = "npm run start"
